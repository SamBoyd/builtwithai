[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "builtwithai"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click==8.4.1",
    "instructor==1.15.1",
    "openai==2.38.0",
    "PyGithub==2.9.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "textual==8.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[project.scripts]
builtwithai = "prototype.cli:cli"

[tool.setuptools.packages.find]
include = ["prototype*"]
